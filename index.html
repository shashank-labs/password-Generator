<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ecfdf5 0%, #f8fffc 50%, #f0fdf4 100%);
      background-attachment: fixed;
      padding: 40px 16px 60px;
      font-family: Arial, sans-serif;
    }
    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .header-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
    .header-icon svg {
      width: 28px;
      height: 28px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .header h1 {
      font-size: 1.6em;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 0.9em;
      color: #6b7280;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 760px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px 22px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f0f0f5;
    }
    .card-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-icon.indigo { background: #ecfdf5; }
    .card-icon.violet { background: #d1fae5; }
    .card-icon svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .card-icon.indigo svg { stroke: #059669; }
    .card-icon.violet svg { stroke: #047857; }
    .card h2 { font-size: 0.97em; font-weight: 600; color: #111827; margin: 0; }
    .card p.sub { font-size: 0.76em; color: #9ca3af; margin: 0; }
    .pwd-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 6px;
    }
    .pwd-box input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.93em;
      font-family: Arial, sans-serif;
      color: #1f2937;
      outline: none;
      min-width: 0;
    }
    .pwd-box input::placeholder { color: #9ca3af; }
    .copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      color: #9ca3af;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .copy-btn:hover { color: #059669; background: #ecfdf5; }
    .copy-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .toast {
      display: none;
      font-size: 0.75em;
      color: #059669;
      text-align: center;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .length-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-size: 0.83em;
      color: #6b7280;
    }
    .length-row input[type=range] {
      flex: 1;
      accent-color: #059669;
      cursor: pointer;
    }
    .length-val {
      font-weight: 600;
      color: #059669;
      background: #ecfdf5;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.83em;
      min-width: 32px;
      text-align: center;
    }
    .btn-primary {
      width: 100%;
      padding: 11px;
      font-size: 0.9em;
      font-weight: 600;
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .btn-primary:hover { background: #047857; }
    .btn-primary svg { width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .btn-outline {
      width: 100%;
      padding: 10px;
      font-size: 0.85em;
      font-weight: 500;
      background: #fff;
      color: #374151;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.18s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-outline:hover { background: #f9fafb; border-color: #d1d5db; }
    .btn-outline svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pwd-input-wrap {
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pwd-input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.93em;
      font-family: Arial, sans-serif;
      color: #1f2937;
      outline: none;
      min-width: 0;
    }
    .pwd-input-wrap input::placeholder { color: #9ca3af; }
    .eye-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .eye-btn:hover { color: #6b7280; }
    .eye-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .strength-bar {
      display: flex;
      gap: 5px;
      margin-bottom: 6px;
    }
    .seg {
      flex: 1;
      height: 5px;
      border-radius: 3px;
      background: #e5e7eb;
      transition: background 0.3s;
    }
    .strength-label {
      font-size: 0.76em;
      margin-bottom: 14px;
      font-weight: 500;
      min-height: 16px;
    }
    .chips-label {
      font-size: 0.76em;
      color: #6b7280;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .chip {
      font-size: 0.73em;
      padding: 5px 10px;
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      border-radius: 20px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-weight: 500;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .chip:hover { background: #a7f3d0; }
    .result-msg {
      font-size: 0.8em;
      font-weight: 500;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      margin-top: 8px;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: #f9fafb;
      color: #6b7280;
    }
    .result-msg svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
