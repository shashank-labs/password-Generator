<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      /* Vibrant Modern Light Mesh Gradient */
      background: 
        radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 90% 15%, rgba(99, 102, 241, 0.14) 0%, transparent 40%),
        radial-gradient(circle at 50% 75%, rgba(6, 182, 212, 0.12) 0%, transparent 50%),
        linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%);
      background-attachment: fixed;
      padding: 40px 16px 60px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
    }
    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .header-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2);
    }
    .header-icon svg {
      width: 28px;
      height: 28px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .header h1 {
      font-size: 1.8em;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 0.9em;
      color: #64748b;
    }
    /* Grid configuration framing the central divider column */
    .grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
      gap: 16px;
      max-width: 880px;
      margin: 0 auto;
    }
    /* Premium Light Glassmorphism Cards */
    .card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 28px 24px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid #f1f5f9;
    }
    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-icon.indigo { background: #e6fbf2; border: 1px solid #c6f6e2; }
    .card-icon.violet { background: #ecfeff; border: 1px solid #cffafe; }
    .card-icon svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .card-icon.indigo svg { stroke: #059669; }
    .card-icon.violet svg { stroke: #0891b2; }
    .card h2 { font-size: 1em; font-weight: 600; color: #0f172a; margin: 0; }
    .card p.sub { font-size: 0.8em; color: #64748b; margin: 2px 0 0; }
    /* Modern Intelligent Visual Alternative Divider */
    .or-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0 8px;
      min-width: 40px;
    }
    .or-divider::before {
      content: '';
      position: absolute;
      background: linear-gradient(to bottom, transparent, #e2e8f0 15%, #e2e8f0 85%, transparent);
      width: 1.5px;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
    }
    .or-divider span {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0;
      color: #94a3b8;
      font-size: 0.72em;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 20px;
      letter-spacing: 0.06em;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.02);
    }
    /* Modern Crisp Inputs */
    .pwd-box, .pwd-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(248, 250, 252, 0.8);
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .pwd-box:focus-within, .pwd-input-wrap:focus-within {
      border-color: #10b981;
      background: #fff;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.1);
    }
    .pwd-box input, .pwd-input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.95em;
      font-family: inherit;
      font-weight: 500;
      color: #0f172a;
      outline: none;
      min-width: 0;
      letter-spacing: 0.02em;
    }
    .pwd-box input::placeholder, .pwd-input-wrap input::placeholder { 
      color: #94a3b8; 
      letter-spacing: 0; 
    }
    .copy-btn, .eye-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: #94a3b8;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .copy-btn:hover { color: #059669; background: #e6fbf2; }
    .eye-btn:hover { color: #0891b2; background: #ecfeff; }
    .copy-btn svg, .eye-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .toast {
      display: none;
      font-size: 0.8em;
      color: #059669;
      text-align: center;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .length-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      font-size: 0.85em;
      color: #64748b;
    }
    .length-row input[type=range] {
      flex: 1;
      accent-color: #10b981;
      cursor: pointer;
      background: #e2e8f0;
      height: 6px;
      border-radius: 3px;
    }
    .length-val {
      font-weight: 600;
      color: #059669;
      background: #e6fbf2;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 0.85em;
      min-width: 36px;
      text-align: center;
      border: 1px solid #c6f6e2;
    }
    .btn-primary {
      width: 100%;
      padding: 13px;
      font-size: 0.95em;
      font-weight: 600;
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
    }
    .btn-primary:hover { 
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .btn-outline {
      width: 100%;
      padding: 12px;
      font-size: 0.9em;
      font-weight: 500;
      background: #fff;
      color: #334155;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.18s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; color: #0f172a; }
    .btn-outline svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .strength-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .seg {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #e2e8f0;
      transition: background 0.3s;
    }
    .strength-label {
      font-size: 0.8em;
      margin-bottom: 16px;
      font-weight: 700;
      min-height: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .chips-label {
      font-size: 0.8em;
      color: #64748b;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    /* Modern Minimal Chips */
    .chip {
      font-size: 0.8em;
      padding: 6px 14px;
      background: #e6fbf2;
      color: #065f46;
      border: 1px solid #c6f6e2;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .chip:hover { background: #c6f6e2; color: #044e39; border-color: #a7f3d0; }
    .result-msg {
      font-size: 0.85em;
      font-weight: 500;
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      margin-top: 12px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #f8fafc;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }
    .result-msg svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    /* Handles the responsive swap when cards stack */
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; gap: 8px; }
      body { padding: 20px 12px 40px; }
      .or-divider {
        padding: 12px 0;
        width: 100%;
      }
      .or-divider::before {
        width: 100%;
        height: 1.5px;
        top: 50%;
        left: 0;
        right: 0;
        bottom: auto;
        transform: translateY(-50%);
        background: linear-gradient(to right, transparent, #e2e8f0 20%, #e2e8f0 80%, transparent);
      }
